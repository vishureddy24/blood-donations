<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Donor Management</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="top-header">
        <div class="brand-wrap">
          <div class="brand-icon">🩸</div>
          <div>
            <h1>BLOOD DONOR MANAGEMENT</h1>
            <p>Register, manage and find blood donors easily.</p>
          </div>
        </div>
      </header>

      <main class="main-layout">
        <section class="panel form-panel">
          <h2>Add New Donor</h2>

          <form id="donorForm">
            <div class="field-group">
              <label for="name">Full Name</label>
              <input id="name" name="name" type="text" placeholder="Enter donor name" required />
            </div>

            <div class="field-group">
              <label for="phone">Phone Number</label>
              <input id="phone" name="phone" type="tel" placeholder="Enter phone number" required />
            </div>

            <div class="field-group">
              <label for="bloodGroup">Blood Group</label>
              <select id="bloodGroup" name="bloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>

            <div class="field-group">
              <label for="city">City</label>
              <input id="city" name="city" type="text" placeholder="Enter city" required />
            </div>

            <div class="field-group">
              <label for="availability">Availability</label>
              <select id="availability" name="availability">
                <option value="true">Available</option>
                <option value="false">Not Available</option>
              </select>
            </div>

            <button type="submit" class="primary-btn">Register Donor</button>
          </form>

          <div id="formMessage" class="message-box" aria-live="polite"></div>
        </section>

        <section class="panel list-panel">
          <div class="stats-row">
            <div class="stat-card">
              <span>Total Donors</span>
              <strong id="totalDonors">0</strong>
            </div>
            <div class="stat-card available-card">
              <span>Available</span>
              <strong id="availableDonors">0</strong>
            </div>
            <div class="stat-card unavailable-card">
              <span>Unavailable</span>
              <strong id="unavailableDonors">0</strong>
            </div>
          </div>

          <div class="toolbar">
            <div class="search-box">
              <input id="searchInput" type="text" placeholder="Search donors..." />
            </div>

            <div class="filter-box">
              <select id="bloodFilter">
                <option value="All">All Blood Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Blood Group</th>
                  <th>Phone</th>
                  <th>City</th>
                  <th>Availability</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="donorTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
